name: record-cloud
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *service-defaults
    image: ${RECORD_API_IMAGE:?required}
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: mysql://${DB_USERNAME:?required}:${DB_PASSWORD:?required}@${DB_HOST:?required}:${DB_PORT:?required}/${DB_DATABASE:?required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
      BASE_URL: ${APP_URL:?required}/api
      WEB_BASE_URL: ${APP_URL:?required}
      STORAGE_DRIVER: s3
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:?required}
      S3_ENDPOINT: ${S3_ENDPOINT:?required}
      S3_REGION: ${S3_REGION:?required}
      S3_BUCKET: ${S3_BUCKET:?required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?required}
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: ${SMTP_HOST:?required}
      SMTP_PORT: ${SMTP_PORT:?required}
      SMTP_SECURE: "false"
      SMTP_FROM: ${SMTP_FROM:?required}
    networks: [internal, shared]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
  web:
    <<: *service-defaults
    image: ${RECORD_WEB_IMAGE:?required}
    expose: ["3000"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${APP_URL:?required}/api
      API_URL: http://api:4000
    networks: [internal]
    depends_on:
      api:
        condition: service_healthy

networks:
  internal:
  shared:
    name: ${SHARED_NETWORK_NAME:?SHARED_NETWORK_NAME is required}
    external: true
