name: albert
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-laravel-env: &laravel-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?APP_URL is required}
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  DB_CONNECTION: mysql
  DB_HOST: ${DB_HOST:?DB_HOST is required}
  DB_PORT: ${DB_PORT:?DB_PORT is required}
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  REDIS_CLIENT: phpredis
  REDIS_HOST: ${QUEUE_HOST:?QUEUE_HOST is required}
  REDIS_PORT: ${QUEUE_PORT:?QUEUE_PORT is required}
  REDIS_USERNAME: ${QUEUE_USERNAME:?QUEUE_USERNAME is required}
  REDIS_PASSWORD: ${QUEUE_PASSWORD:?QUEUE_PASSWORD is required}
  REDIS_PREFIX: ${QUEUE_PREFIX:?QUEUE_PREFIX is required}
  HORIZON_PREFIX: "${QUEUE_PREFIX:?QUEUE_PREFIX is required}horizon:"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  MAIL_MAILER: smtp
  MAIL_HOST: ${SMTP_HOST:?SMTP_HOST is required}
  MAIL_PORT: ${SMTP_PORT:?SMTP_PORT is required}
  MAIL_ENCRYPTION: "null"
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS is required}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:?MAIL_FROM_NAME is required}
  LOG_CHANNEL: stderr

x-albert-app: &albert-app
  build:
    context: https://github.com/ulpi-io/albert.git#main:api
    dockerfile: docker/app/Dockerfile.prod
    secrets:
      - source: git_auth_token
        target: GIT_AUTH_TOKEN
  environment:
    <<: *laravel-env
    QDRANT_URL: ${QDRANT_URL:?required}
    QDRANT_API_KEY: ${QDRANT_API_KEY:?required}
    REVERB_APP_ID: ${REVERB_APP_ID:?required}
    REVERB_APP_KEY: ${REVERB_APP_KEY:?required}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:?required}
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
  networks: [internal, shared]
services:
  migrate:
    <<: [*service-defaults, *albert-app]
    restart: "no"
    command: ["sh", "-c", "php artisan config:clear && php artisan migrate --force"]
  app:
    <<: [*service-defaults, *albert-app]
    command: ["sh", "-c", "php artisan config:clear && exec php-fpm"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
  nginx:
    <<: *service-defaults
    build:
      context: https://github.com/ulpi-io/albert.git#main:api
      dockerfile_inline: |
        FROM nginx:alpine
        RUN rm /etc/nginx/conf.d/default.conf
        COPY docker/nginx/default.conf /etc/nginx/conf.d/default.conf
        COPY public /var/www/html/public
        EXPOSE 80
        CMD ["nginx", "-g", "daemon off;"]
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
    expose: ["80"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/public/index.php && wget -qO- http://127.0.0.1/nginx-health | grep -q healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      app:
        condition: service_healthy
  worker:
    <<: [*service-defaults, *albert-app]
    command: ["sh", "-c", "php artisan config:clear && exec php artisan horizon"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  scheduler:
    <<: [*service-defaults, *albert-app]
    command: ["sh", "-c", "php artisan config:clear && while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  reverb:
    <<: [*service-defaults, *albert-app]
    command: ["sh", "-c", "php artisan config:clear && exec php artisan reverb:start --host=0.0.0.0 --port=8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    <<: *service-defaults
    build:
      context: https://github.com/ulpi-io/albert.git#main:web
      dockerfile: docker/Dockerfile.prod
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
    expose: ["3000"]
    environment:
      NODE_ENV: production
      API_BASE_URL: http://nginx
      NEXT_PUBLIC_BASE_URL: ${APP_URL:?required}
      NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:?required}
      SESSION_SECRET: ${SESSION_SECRET:?required}
    networks: [internal]
  agents:
    <<: *service-defaults
    build:
      context: https://github.com/ulpi-io/albert.git#main:agents
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        RUN corepack enable && corepack prepare pnpm@10.28.2 --activate
        COPY package.json pnpm-lock.yaml ./
        RUN pnpm install --no-frozen-lockfile
        COPY . .
        RUN pnpm build
        ENV NODE_ENV=production HOSTNAME=0.0.0.0 PORT=3001
        EXPOSE 3001
        CMD ["pnpm", "start"]
    environment:
      NODE_ENV: production
      API_BASE_URL: http://nginx
      NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:?required}
      SESSION_SECRET: ${SESSION_SECRET:?required}
    networks: [internal]

networks:
  internal:
  shared:
    name: ${SHARED_NETWORK_NAME:?SHARED_NETWORK_NAME is required}
    external: true

secrets:
  git_auth_token:
    environment: GIT_AUTH_TOKEN
