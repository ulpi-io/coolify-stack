name: postiz
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postiz:
    <<: *service-defaults
    labels:
      traefik.docker.network: ${COOLIFY_RESOURCE_UUID:-}
    image: ${POSTIZ_IMAGE:?required}
    expose: ["5000"]
    environment:
      MAIN_URL: ${APP_URL:?required}
      FRONTEND_URL: ${APP_URL:?required}
      NEXT_PUBLIC_BACKEND_URL: ${APP_URL:?required}/api
      JWT_SECRET: ${JWT_SECRET:?required}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      DATABASE_URL: postgresql://${DB_USERNAME:?required}:${DB_PASSWORD:?required}@${DB_HOST:?required}:${DB_PORT:?required}/${DB_DATABASE:?required}
      REDIS_URL: redis://${QUEUE_USERNAME:?required}:${QUEUE_PASSWORD:?required}@${QUEUE_HOST:?required}:${QUEUE_PORT:?required}/2
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:?required}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:?required}
      BACKEND_INTERNAL_URL: http://127.0.0.1:3000
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-true}
      RUN_CRON: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      NX_ADD_PLUGINS: "false"
    volumes:
      - postiz-config:/config
      - postiz-uploads:/uploads
    networks: [internal, shared]
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http');const c=p=>new Promise((ok,no)=>{const r=h.get({host:'127.0.0.1',port:p,path:'/'},x=>x.statusCode<500?ok():no());r.setTimeout(5000,()=>{r.destroy();no()});r.on('error',no)});Promise.all([c(5000),c(3000)]).then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
volumes:
  postiz-config:
  postiz-uploads:

networks:
  internal:
  shared:
    name: ${SHARED_NETWORK_NAME:?SHARED_NETWORK_NAME is required}
    external: true
