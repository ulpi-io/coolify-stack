name: togglebox
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *service-defaults
    image: ${TOGGLEBOX_API_IMAGE:?required}
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_TYPE: mysql
      DATABASE_URL: mysql://${DB_USERNAME:?required}:${DB_PASSWORD:?required}@${DB_HOST:?required}:${DB_PORT:?required}/${DB_DATABASE:?required}
      MYSQL_URL: mysql://${DB_USERNAME:?required}:${DB_PASSWORD:?required}@${DB_HOST:?required}:${DB_PORT:?required}/${DB_DATABASE:?required}
      ENABLE_AUTHENTICATION: "true"
      JWT_SECRET: ${JWT_SECRET:?required}
      API_KEY_SECRET: ${API_KEY_SECRET:?required}
      APP_URL: ${APP_URL:?required}
      CORS_ORIGIN: ${APP_URL:?required}
      SMTP_HOST: ${SMTP_HOST:?required}
      SMTP_PORT: ${SMTP_PORT:?required}
      FROM_EMAIL: ${MAIL_FROM_ADDRESS:?required}
      FROM_NAME: ${MAIL_FROM_NAME:?required}
    networks: [internal, shared]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
  admin:
    <<: *service-defaults
    image: ${TOGGLEBOX_ADMIN_IMAGE:?required}
    expose: ["3001"]
    environment:
      NODE_ENV: production
      API_URL: http://api:3000
      NEXT_PUBLIC_API_URL: ${APP_URL:?required}/api
    networks: [internal]
    depends_on:
      api:
        condition: service_healthy

networks:
  internal:
  shared:
    name: ${SHARED_NETWORK_NAME:?SHARED_NETWORK_NAME is required}
    external: true
