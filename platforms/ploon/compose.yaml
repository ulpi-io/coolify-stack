name: ploon
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *service-defaults
    build:
      context: https://github.com/ulpi-io/ploon-web.git#main
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:?required}
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        RUN corepack enable && corepack prepare pnpm@10.28.2 --activate
        COPY package.json pnpm-lock.yaml ./
        RUN pnpm install --frozen-lockfile
        COPY . .
        ARG NEXT_PUBLIC_APP_URL
        ENV NEXT_PUBLIC_APP_URL=$${NEXT_PUBLIC_APP_URL}
        RUN pnpm build
        ENV NODE_ENV=production HOSTNAME=0.0.0.0 PORT=3000
        EXPOSE 3000
        CMD ["pnpm", "start"]
    expose: ["3000"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${APP_URL:?required}
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  internal:
  shared:
    name: ${SHARED_NETWORK_NAME:?SHARED_NETWORK_NAME is required}
    external: true

secrets:
  git_auth_token:
    environment: GIT_AUTH_TOKEN
