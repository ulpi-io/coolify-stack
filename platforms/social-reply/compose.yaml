  META_WEBHOOK_VERIFY_TOKEN:
  META_DATA_DELETION_STATUS_ORIGIN: ${APP_FRONTEND_URL:?required}
  META_GRAPH_API_VERSION: v25.0
  WHATSAPP_APP_ID:
  WHATSAPP_APP_SECRET:
  WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID:
  WHATSAPP_WEBHOOK_VERIFY_TOKEN:
  WHATSAPP_GRAPH_API_VERSION: v25.0
  WHATSAPP_TEMPLATE_MEDIA_DISK: s3
  TELEGRAM_API_BASE_URI: https://api.telegram.org
  TWILIO_ACCOUNT_SID:
  TWILIO_AUTH_TOKEN:
  TWILIO_MESSAGING_SERVICE_SID:
  TWILIO_FROM_NUMBER:
  TIKTOK_BUSINESS_APP_ID:
  TIKTOK_BUSINESS_APP_SECRET:
  TIKTOK_BUSINESS_REDIRECT_URI: ${APP_URL:?required}/api/v1/channel-accounts/tiktok/callback
