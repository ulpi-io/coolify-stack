name: social-reply

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Coolify 4.1.2 rewrites a named Dockerfile inside a remote Git context as a
# local recipe path. Inline the pinned upstream production stages instead;
# doubled dollars are Compose escapes and reach BuildKit once.
x-api-dockerfile: &api-dockerfile |

  FROM php:8.4-fpm-alpine3.22@sha256:e0f1ffe8bd43a137facdccdcac41cabdfc23e8d0fdd0665916a062f16e2f4058 AS base

  ARG PECL_REDIS_VERSION=6.3.0

  WORKDIR /var/www/html

  RUN set -eux; \
      apk add --no-cache \
          fcgi \
          freetype \
          icu-libs \
          libjpeg-turbo \
          libpng \
          libpq \
          libzip \
          tini; \
      apk add --no-cache --virtual .build-deps \
          $$PHPIZE_DEPS \
          freetype-dev \
          icu-dev \
          libjpeg-turbo-dev \
          libpng-dev \
          libpq-dev \
          libzip-dev \
          linux-headers; \
      docker-php-ext-configure gd --with-freetype --with-jpeg; \
      docker-php-ext-install -j"$$(nproc)" \
          bcmath \
          gd \
          intl \
          pcntl \
          pdo_pgsql \
          zip; \
      pecl install "redis-$${PECL_REDIS_VERSION}"; \
      docker-php-ext-enable redis; \
      pecl clear-cache; \
      apk del --no-network .build-deps; \
      rm -rf /tmp/pear /usr/local/lib/php/doc; \
      php -m

  RUN { \
          echo 'expose_php = Off'; \
          echo 'memory_limit = 256M'; \
          echo 'display_errors = Off'; \
          echo 'display_startup_errors = Off'; \
          echo 'log_errors = On'; \
          echo 'error_log = /proc/self/fd/2'; \
          echo 'upload_max_filesize = 100M'; \
          echo 'post_max_size = 101M'; \
          echo 'max_execution_time = 60'; \
          echo 'date.timezone = UTC'; \
          echo 'opcache.enable = 1'; \
          echo 'opcache.memory_consumption = 192'; \
          echo 'opcache.interned_strings_buffer = 16'; \
          echo 'opcache.max_accelerated_files = 20000'; \
          echo 'opcache.validate_timestamps = 0'; \
          echo 'opcache.enable_cli = 0'; \
      } > /usr/local/etc/php/conf.d/zz-socialreply.ini

  RUN { \
          echo '[global]'; \
          echo 'error_log = /proc/self/fd/2'; \
          echo 'daemonize = no'; \
          echo '[www]'; \
          echo 'clear_env = no'; \
          echo 'access.log = /proc/self/fd/2'; \
          echo 'catch_workers_output = yes'; \
          echo 'decorate_workers_output = no'; \
          echo 'pm = dynamic'; \
          echo 'pm.max_children = 20'; \
          echo 'pm.start_servers = 4'; \
          echo 'pm.min_spare_servers = 2'; \
          echo 'pm.max_spare_servers = 6'; \
          echo 'pm.max_requests = 500'; \
      } > /usr/local/etc/php-fpm.d/zz-socialreply.conf

  ENTRYPOINT ["/sbin/tini", "--", "docker-php-entrypoint"]

  FROM base AS vendor

  ENV BROADCAST_CONNECTION=log

  ARG COMPOSER_VERSION=2.10.2
  ARG COMPOSER_SHA256=5ee7125f8a30a34d246cefdc0bc85b8a783b28f2aec968994118512350d28027

  RUN set -eux; \
      wget -O /tmp/composer.phar \
          "https://getcomposer.org/download/$${COMPOSER_VERSION}/composer.phar"; \
      echo "$${COMPOSER_SHA256}  /tmp/composer.phar" | sha256sum -c -; \
      mv /tmp/composer.phar /usr/local/bin/composer; \
      chmod +x /usr/local/bin/composer; \
      composer --version

  COPY composer.json composer.lock ./

  RUN --mount=type=cache,target=/tmp/composer-cache,sharing=locked \
      COMPOSER_CACHE_DIR=/tmp/composer-cache \
      COMPOSER_ALLOW_SUPERUSER=1 \
      composer install \
          --no-dev \
          --no-scripts \
          --no-autoloader \
          --no-interaction \
          --no-progress \
          --prefer-dist

  FROM vendor AS build

  COPY . .

  RUN set -eux; \
      mkdir -p \
          storage/app/private \
          storage/app/public \
          storage/framework/cache/data \
          storage/framework/sessions \
          storage/framework/testing \
          storage/framework/views \
          storage/logs \
          bootstrap/cache; \
      COMPOSER_ALLOW_SUPERUSER=1 composer dump-autoload --no-dev --optimize; \
      php artisan package:discover --ansi; \
      rm -rf \
          tests \
          phpunit.xml \
          phpstan.neon \
          pint.json \
          .editorconfig

  FROM base AS runtime

  COPY --from=build --chown=www-data:www-data /var/www/html /var/www/html

  RUN chmod -R u+rwX,g+rwX storage bootstrap/cache

  USER www-data

  EXPOSE 9000

  CMD ["php-fpm"]

  FROM nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6 AS web-server

  COPY docker/nginx/api.conf /etc/nginx/conf.d/default.conf

  COPY --from=build /var/www/html/public /var/www/html/public


  EXPOSE 8080

x-web-dockerfile: &web-dockerfile |

  FROM node:20.20.2-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293 AS base

  ARG NPM_VERSION=11.11.0
  RUN npm install -g "npm@$${NPM_VERSION}" && npm -v

  WORKDIR /app

  FROM base AS deps

  COPY package.json package-lock.json ./

  RUN --mount=type=cache,target=/root/.npm,sharing=locked \
      npm ci --ignore-scripts --no-audit --no-fund

  FROM base AS build

  ARG NEXT_PUBLIC_API_BASE_URL=""
  ARG NEXT_PUBLIC_REVERB_HOST=""
  ARG NEXT_PUBLIC_REVERB_PORT=""
  ARG NEXT_PUBLIC_REVERB_SCHEME="http"
  ARG NEXT_PUBLIC_REVERB_APP_KEY=""
  ARG NEXT_PUBLIC_BASE_URL=""
  ENV NEXT_PUBLIC_API_BASE_URL=$$NEXT_PUBLIC_API_BASE_URL \
      NEXT_PUBLIC_REVERB_HOST=$$NEXT_PUBLIC_REVERB_HOST \
      NEXT_PUBLIC_REVERB_PORT=$$NEXT_PUBLIC_REVERB_PORT \
      NEXT_PUBLIC_REVERB_SCHEME=$$NEXT_PUBLIC_REVERB_SCHEME \
      NEXT_PUBLIC_REVERB_APP_KEY=$$NEXT_PUBLIC_REVERB_APP_KEY \
      NEXT_PUBLIC_BASE_URL=$$NEXT_PUBLIC_BASE_URL

  ENV NODE_ENV=production \
      NEXT_TELEMETRY_DISABLED=1

  COPY --from=deps /app/node_modules ./node_modules
  COPY . .

  RUN npm run build

  FROM node:20.20.2-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293 AS runtime

  RUN apk add --no-cache tini

  WORKDIR /app

  ARG NEXT_PUBLIC_BASE_URL=""

  ENV NODE_ENV=production \
      NEXT_TELEMETRY_DISABLED=1 \
      NEXT_PUBLIC_BASE_URL=$$NEXT_PUBLIC_BASE_URL \
      PORT=3000 \
      HOSTNAME=0.0.0.0

  COPY --from=build --chown=node:node /app/.next/standalone ./
  COPY --from=build --chown=node:node /app/.next/static ./.next/static
  COPY --from=build --chown=node:node /app/messages ./messages

  USER node

  EXPOSE 3000

  ENTRYPOINT ["/sbin/tini", "--"]
  CMD ["node", "server.js"]

x-api-build: &api-build
  context: https://github.com/ulpi-io/social-reply.git#${SOCIAL_REPLY_SOURCE_REF:?required}:api
  dockerfile_inline: *api-dockerfile
  target: runtime
  secrets:
    - source: git_auth_token
      target: GIT_AUTH_TOKEN

x-api-runtime-image: &api-runtime-image
  image: socialreply-api-${COOLIFY_RESOURCE_UUID:-local}:${SOCIAL_REPLY_SOURCE_REF:?required}

x-api-image: &api-image
  <<: *api-runtime-image
  build: *api-build

x-api-environment: &api-environment
  APP_NAME: SocialReply
