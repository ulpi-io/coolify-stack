  YOUTUBE_REPLY_RESERVE_UNITS: ${YOUTUBE_REPLY_RESERVE_UNITS:?required}
  RESEND_API_KEY:
  RESEND_WEBHOOK_SECRET:

services:
  social-reply-postgres:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE:?required}
    shm_size: 256mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?required}
      POSTGRES_DB: postgres
    volumes:
      - social-reply-postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  database-bootstrap:
    image: ${POSTGRES_IMAGE:?required}
    restart: "no"
    environment:
      PGHOST: social-reply-postgres
      PGUSER: postgres
      PGPASSWORD: ${DB_ADMIN_PASSWORD:?required}
      DB_PASSWORD: ${DB_PASSWORD:?required}
    networks: [internal]
    depends_on:
      social-reply-postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$DB_PASSWORD" in *[!0-9a-f]*) echo "DB_PASSWORD must be lowercase hex" >&2; exit 1;; esac
        if ! psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='socialreply'" | grep -qx 1; then
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE socialreply LOGIN PASSWORD '$$DB_PASSWORD' NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT CONNECTION LIMIT 100"
        else
          psql -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE socialreply PASSWORD '$$DB_PASSWORD'"
        fi
        if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='socialreply'" | grep -qx 1; then
          createdb -O socialreply socialreply
        fi
        psql -d socialreply -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector"

  migrate:
    <<: [*service-defaults, *api-runtime-image]
    restart: "no"
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    environment: *api-environment
    networks: [internal, shared]
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M

  app:
    <<: [*service-defaults, *api-image]
    command: ["php-fpm"]
    environment: *api-environment
    expose: ["9000"]
    networks: [internal, shared]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REQUEST_METHOD=GET SCRIPT_NAME=/index.php
          SCRIPT_FILENAME=/var/www/html/public/index.php
          DOCUMENT_ROOT=/var/www/html/public REQUEST_URI=/up
          SERVER_PROTOCOL=HTTP/1.1 HTTP_ACCEPT=application/json
          cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q '"status":"up"'
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    <<: *service-defaults
    labels:
      traefik.docker.network: ${COOLIFY_RESOURCE_UUID:-}
    build:
      context: https://github.com/ulpi-io/social-reply.git#${SOCIAL_REPLY_SOURCE_REF:?required}:api
      dockerfile_inline: *api-dockerfile
      target: web-server
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
    image: socialreply-nginx-${COOLIFY_RESOURCE_UUID:-local}:${SOCIAL_REPLY_SOURCE_REF:?required}
    expose: ["8080"]
    networks: [internal]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Accept: application/json' http://127.0.0.1:8080/up | grep -q '\"status\":\"up\"'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M

  horizon:
    <<: [*service-defaults, *api-runtime-image]
    command: ["php", "artisan", "horizon"]
    environment: *api-environment
    networks: [internal, shared]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s
    stop_signal: SIGTERM
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G

  scheduler:
    <<: [*service-defaults, *api-runtime-image]
    command: ["php", "artisan", "schedule:work"]
    environment: *api-environment
    networks: [internal, shared]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' >/dev/null && php artisan schedule:list --no-ansi >/dev/null"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    stop_signal: SIGTERM
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  reverb:
    <<: [*service-defaults, *api-runtime-image]
    labels:
      traefik.docker.network: ${COOLIFY_RESOURCE_UUID:-}
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment: *api-environment
    expose: ["8080"]
    networks: [internal, shared]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/up | grep -q OK"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_signal: SIGTERM
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    <<: *service-defaults
    labels:
      traefik.docker.network: ${COOLIFY_RESOURCE_UUID:-}
    build:
      context: https://github.com/ulpi-io/social-reply.git#${SOCIAL_REPLY_SOURCE_REF:?required}:web
      dockerfile_inline: *web-dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?required}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST:?required}
        NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT:?required}
        NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME:?required}
        NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:?required}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?required}
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
    image: socialreply-web-${COOLIFY_RESOURCE_UUID:-local}:${SOCIAL_REPLY_SOURCE_REF:?required}
    expose: ["3000"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://nginx:8080
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?required}
    networks: [internal]
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/en | grep -q '<html'"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_signal: SIGTERM
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  social-reply-postgres-data:
    labels:
      com.socialreply.volume: postgres

networks:
  internal:
  shared:
    name: ${SHARED_NETWORK_NAME:?required}
    external: true

