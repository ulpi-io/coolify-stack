  REVERB_SERVER_PORT: "8080"
  REVERB_SCALING_ENABLED: "true"
  REVERB_SCALING_CHANNEL: social-reply:reverb
  REVERB_ALLOWED_ORIGINS: ${APP_FRONTEND_URL:?required}

  BILLING_ENABLED: ${BILLING_ENABLED:-false}
  BILLING_CATALOG_PUBLISH_ENABLED: ${BILLING_CATALOG_PUBLISH_ENABLED:-false}
  STRIPE_KEY:
  STRIPE_SECRET:
  STRIPE_WEBHOOK_SECRET:
  STRIPE_WEBHOOK_TOLERANCE: ${STRIPE_WEBHOOK_TOLERANCE:?required}
  STRIPE_API_VERSION: ${STRIPE_API_VERSION:?required}
  STRIPE_CHECKOUT_CONFIGURATION_ID:
  STRIPE_PORTAL_CONFIGURATION_ID:
  AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-openai}
  AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-gpt-5.4}
  AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
  AI_EMBEDDING_DIMENSIONS: "1536"
  OPENAI_API_KEY:
  ANTHROPIC_API_KEY:
  DEEPSEEK_API_KEY:
  OPENROUTER_API_KEY:
  OPENROUTER_URL: ${OPENROUTER_URL:?required}
  GEMINI_API_KEY:
  GOOGLE_CLIENT_ID:
  GOOGLE_CLIENT_SECRET:
  GOOGLE_REDIRECT_URI: ${APP_URL:?required}/api/v1/auth/google/callback
  GOOGLE_SHEETS_REDIRECT_URI: ${APP_URL:?required}/api/v1/integrations/google_sheets/oauth/callback
  HUBSPOT_CLIENT_ID:
