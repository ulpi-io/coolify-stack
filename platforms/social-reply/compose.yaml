  YOUTUBE_VIDEO_MAX_ITEMS: ${YOUTUBE_VIDEO_MAX_ITEMS:?required}
  YOUTUBE_FAILURE_BACKOFF_SECONDS: ${YOUTUBE_FAILURE_BACKOFF_SECONDS:?required}
