  YOUTUBE_POLL_MAX_PAGES: ${YOUTUBE_POLL_MAX_PAGES:?required}
  YOUTUBE_POLL_MAX_COMMENTS: ${YOUTUBE_POLL_MAX_COMMENTS:?required}
