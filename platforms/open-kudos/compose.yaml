name: open-kudos
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-laravel-env: &laravel-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL is required}
  FRONTEND_URL: ${APP_URL:?APP_URL is required}
  CORS_ALLOWED_ORIGINS: ${APP_URL:?APP_URL is required}
  SANCTUM_STATEFUL_DOMAINS: www.teamtoast.ai
  SESSION_DOMAIN: .teamtoast.ai
  SESSION_SECURE_COOKIE: "true"
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  DB_CONNECTION: mysql
  DB_HOST: ${DB_HOST:?DB_HOST is required}
  DB_PORT: ${DB_PORT:?DB_PORT is required}
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  REDIS_CLIENT: phpredis
  REDIS_HOST: ${QUEUE_HOST:?QUEUE_HOST is required}
  REDIS_PORT: ${QUEUE_PORT:?QUEUE_PORT is required}
  REDIS_USERNAME: ${QUEUE_USERNAME:?QUEUE_USERNAME is required}
  REDIS_PASSWORD: ${QUEUE_PASSWORD:?QUEUE_PASSWORD is required}
  REDIS_PREFIX: ${QUEUE_PREFIX:?QUEUE_PREFIX is required}
  HORIZON_PREFIX: "${QUEUE_PREFIX:?QUEUE_PREFIX is required}horizon:"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  MAIL_MAILER: smtp
  MAIL_HOST: ${SMTP_HOST:?SMTP_HOST is required}
  MAIL_PORT: ${SMTP_PORT:?SMTP_PORT is required}
  MAIL_ENCRYPTION: "null"
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS is required}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:?MAIL_FROM_NAME is required}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
  GOOGLE_CHAT_PROJECT_NUMBER: ${GOOGLE_CHAT_PROJECT_NUMBER:?GOOGLE_CHAT_PROJECT_NUMBER is required}
  GOOGLE_CHAT_SERVICE_ACCOUNT_KEY_PATH: /run/secrets/google-chat-service-account.json
  LOG_CHANNEL: stderr

x-api-volumes: &api-volumes
  - type: bind
    source: /data/coolify/secrets/teamtoast/google-chat-service-account.json
    target: /run/secrets/google-chat-service-account.json
    read_only: true

x-api-image: &api-image
  build:
    context: https://github.com/ulpi-io/open-kudos-api.git#main
    dockerfile: docker/php/Dockerfile
    secrets:
      - source: git_auth_token
        target: GIT_AUTH_TOKEN
  environment: *laravel-env
  volumes: *api-volumes
  networks: [internal, shared]
services:
  migrate:
    <<: [*service-defaults, *api-image]
    restart: "no"
    command: ["sh", "-c", "php artisan migrate --force && php artisan config:cache && php artisan route:cache"]
  app:
    <<: [*service-defaults, *api-image]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 5
  nginx:
    <<: *service-defaults
    build:
      context: https://github.com/ulpi-io/open-kudos-api.git#main
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
      dockerfile_inline: |
        FROM nginx:1.27-alpine
        COPY docker/nginx/default.conf /etc/nginx/conf.d/default.conf
        COPY public /var/www/public
        EXPOSE 80
    expose: ["80"]
    networks: [internal]
    depends_on:
      app:
        condition: service_healthy
  worker:
    <<: *service-defaults
    build:
      context: https://github.com/ulpi-io/open-kudos-api.git#main
      dockerfile: docker/worker/Dockerfile
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
    environment: *laravel-env
    volumes: *api-volumes
    networks: [internal, shared]
    depends_on:
      migrate:
        condition: service_completed_successfully
  scheduler:
    <<: *service-defaults
    build:
      context: https://github.com/ulpi-io/open-kudos-api.git#main
      dockerfile: docker/scheduler/Dockerfile
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
    environment: *laravel-env
    volumes: *api-volumes
    networks: [internal, shared]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    <<: *service-defaults
    build:
      context: https://github.com/ulpi-io/open-kudos-web.git#main
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:?required}
        NEXT_PUBLIC_APP_URL: ${APP_URL:?required}
        NEXT_PUBLIC_GOOGLE_CHAT_APP_URL: ${NEXT_PUBLIC_GOOGLE_CHAT_APP_URL:-}
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
    expose: ["3000"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:?required}
      NEXT_PUBLIC_GOOGLE_CHAT_APP_URL: ${NEXT_PUBLIC_GOOGLE_CHAT_APP_URL:-}
      API_URL: http://nginx
    networks: [internal]

networks:
  internal:
  shared:
    name: ${SHARED_NETWORK_NAME:?SHARED_NETWORK_NAME is required}
    external: true

secrets:
  git_auth_token:
    environment: GIT_AUTH_TOKEN
