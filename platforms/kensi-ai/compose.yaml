name: kensi-ai
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-laravel-env: &laravel-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?APP_URL is required}
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  DB_CONNECTION: mysql
  DB_HOST: ${DB_HOST:?DB_HOST is required}
  DB_PORT: ${DB_PORT:?DB_PORT is required}
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  REDIS_CLIENT: phpredis
  REDIS_HOST: ${QUEUE_HOST:?QUEUE_HOST is required}
  REDIS_PORT: ${QUEUE_PORT:?QUEUE_PORT is required}
  REDIS_USERNAME: ${QUEUE_USERNAME:?QUEUE_USERNAME is required}
  REDIS_PASSWORD: ${QUEUE_PASSWORD:?QUEUE_PASSWORD is required}
  REDIS_PREFIX: ${QUEUE_PREFIX:?QUEUE_PREFIX is required}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  MAIL_MAILER: smtp
  MAIL_HOST: ${SMTP_HOST:?SMTP_HOST is required}
  MAIL_PORT: ${SMTP_PORT:?SMTP_PORT is required}
  MAIL_ENCRYPTION: "null"
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS is required}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:?MAIL_FROM_NAME is required}
  LOG_CHANNEL: stderr

x-kensi-app-build: &kensi-app-build
  context: https://github.com/ulpi-io/kensi-ai-api.git#main
  secrets:
    - source: git_auth_token
      target: GIT_AUTH_TOKEN
  dockerfile_inline: |
    FROM php:8.4-fpm AS php-vendor
    ARG UID=1000
    ARG GID=1000
    RUN groupmod -g $${GID} www-data && usermod -u $${UID} -g $${GID} www-data
    RUN apt-get update && apt-get install -y --no-install-recommends \
        git curl zip unzip libpng-dev libjpeg-dev libfreetype6-dev \
        libzip-dev libicu-dev libonig-dev libxml2-dev \
        && docker-php-ext-configure gd --with-freetype --with-jpeg \
        && docker-php-ext-install pdo_mysql bcmath zip gd pcntl intl opcache mbstring xml \
        && pecl install redis && docker-php-ext-enable redis \
        && apt-get clean && rm -rf /var/lib/apt/lists/*
    COPY --from=composer:2 /usr/bin/composer /usr/bin/composer
    COPY docker/php/php.ini /usr/local/etc/php/conf.d/custom.ini
    WORKDIR /var/www/html
    COPY composer.json composer.lock ./
    RUN composer install --no-dev --no-scripts --no-autoloader --no-interaction --prefer-dist

    FROM node:22-alpine AS node-builder
    WORKDIR /build
    COPY package.json ./
    RUN npm install --no-audit --no-fund
    COPY vite.config.js ./
    COPY resources ./resources
    COPY --from=php-vendor /var/www/html/vendor/filament ./vendor/filament
    RUN npm run build

    FROM php-vendor
    COPY . .
    RUN cp -n .env.example .env 2>/dev/null || true; \
        composer dump-autoload --optimize --no-interaction; \
        rm -f .env
    COPY --from=node-builder /build/public/build ./public/build
    RUN chown -R www-data:www-data storage bootstrap/cache
    USER www-data
    EXPOSE 9000
    CMD ["php-fpm"]

services:
  app:
    <<: *service-defaults
    build: *kensi-app-build
    environment: *laravel-env
    networks: [internal, shared]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
  nginx:
    <<: *service-defaults
    build:
      context: https://github.com/ulpi-io/kensi-ai-api.git#main
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
      dockerfile_inline: |
        FROM composer:2 AS composer-vendor
        WORKDIR /build
        COPY composer.json composer.lock ./
        RUN composer install --no-dev --no-scripts --no-autoloader --no-interaction --prefer-dist --ignore-platform-reqs

        FROM node:22-alpine AS node-builder
        WORKDIR /build
        COPY package.json ./
        RUN npm install --no-audit --no-fund
        COPY vite.config.js ./
        COPY resources ./resources
        COPY --from=composer-vendor /build/vendor/filament ./vendor/filament
        RUN npm run build

        FROM nginx:1.27-alpine
        COPY docker/nginx/default.conf /etc/nginx/conf.d/default.conf
        COPY public /var/www/html/public
        COPY --from=node-builder /build/public/build /var/www/html/public/build
        EXPOSE 80
    expose: ["80"]
    networks: [internal]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
  worker:
    <<: *service-defaults
    build: *kensi-app-build
    command: ["php", "artisan", "horizon"]
    environment: *laravel-env
    networks: [internal, shared]
  scheduler:
    <<: *service-defaults
    build: *kensi-app-build
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    environment: *laravel-env
    networks: [internal, shared]
  web:
    <<: *service-defaults
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:?required}
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
      dockerfile_inline: |
        FROM alpine:3.22 AS source
        RUN apk add --no-cache git ca-certificates
        RUN --mount=type=secret,id=GIT_AUTH_TOKEN \
            git -c http.extraHeader="Authorization: Basic $$(printf 'x-access-token:%s' "$$(cat /run/secrets/GIT_AUTH_TOKEN)" | base64)" \
            clone --depth 1 --branch main --no-recurse-submodules \
            https://github.com/ulpi-io/kensi-ai-web.git /src \
            && rm -rf /src/.git

        FROM node:22-alpine
        WORKDIR /app
        COPY --from=source /src/package.json /src/package-lock.json ./
        RUN npm install --no-audit --no-fund
        COPY --from=source /src .
        ARG NEXT_PUBLIC_API_URL
        ENV NEXT_PUBLIC_API_URL=$${NEXT_PUBLIC_API_URL}
        RUN npm run build
        ENV NODE_ENV=production HOSTNAME=0.0.0.0 PORT=3000
        EXPOSE 3000
        CMD ["npm", "run", "start"]
    expose: ["3000"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:?required}
      API_URL: http://nginx
    networks: [internal]
    depends_on:
      nginx:
        condition: service_healthy

networks:
  internal:
  shared:
    name: ${SHARED_NETWORK_NAME:?SHARED_NETWORK_NAME is required}
    external: true

secrets:
  git_auth_token:
    environment: GIT_AUTH_TOKEN
