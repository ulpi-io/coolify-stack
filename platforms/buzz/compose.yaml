name: buzz
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  relay:
    <<: *service-defaults
    labels:
      traefik.docker.network: ${COOLIFY_RESOURCE_UUID:-}
    image: ${BUZZ_IMAGE:?required}
    expose: ["3000"]
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://${DB_USERNAME:?required}:${DB_PASSWORD:?required}@${DB_HOST:?required}:${DB_PORT:?required}/${DB_DATABASE:?required}
      REDIS_URL: redis://${QUEUE_USERNAME:?required}:${QUEUE_PASSWORD:?required}@${QUEUE_HOST:?required}:${QUEUE_PORT:?required}
      RELAY_URL: ${RELAY_URL:?required}
      BUZZ_MEDIA_BASE_URL: ${BUZZ_MEDIA_BASE_URL:?required}
      BUZZ_MEDIA_SERVER_DOMAIN: ${BUZZ_MEDIA_SERVER_DOMAIN:?required}
      BUZZ_CORS_ORIGINS: ${BUZZ_CORS_ORIGINS:?required}
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      BUZZ_ALLOW_NIP_OA_AUTH: "true"
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_GIT_CONFORMANCE_PROBE: "true"
      RELAY_OWNER_PUBKEY: ${RELAY_OWNER_PUBKEY:?required}
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY:?required}
      BUZZ_GIT_HOOK_HMAC_SECRET: ${BUZZ_GIT_HOOK_HMAC_SECRET:?required}
      BUZZ_S3_ENDPOINT: ${S3_ENDPOINT:?required}
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      BUZZ_S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
      BUZZ_S3_BUCKET: ${S3_BUCKET:?required}
      BUZZ_GIT_REPO_PATH: /data/git
      RUST_LOG: ${RUST_LOG:?required}
    volumes:
      - buzz-git-data:/data/git
    networks: [internal, shared]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  buzz-git-data:
    labels:
      com.buzz.volume: git

networks:
  internal:
  shared:
    name: ${SHARED_NETWORK_NAME:?SHARED_NETWORK_NAME is required}
    external: true
