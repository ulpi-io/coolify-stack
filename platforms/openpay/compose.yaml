name: openpay
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-openpay-env: &openpay-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?required}
  APP_KEY: ${APP_KEY:?required}
  DB_CONNECTION: mysql
  DB_HOST: ${DB_HOST:?required}
  DB_PORT: ${DB_PORT:?required}
  DB_DATABASE: ${DB_DATABASE:?required}
  DB_USERNAME: ${DB_USERNAME:?required}
  DB_PASSWORD: ${DB_PASSWORD:?required}
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  MAIL_MAILER: smtp
  MAIL_HOST: ${SMTP_HOST:?required}
  MAIL_PORT: ${SMTP_PORT:?required}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?required}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:?required}
  FILESYSTEM_DISK: s3
  AWS_ENDPOINT: ${S3_ENDPOINT:?required}
  AWS_DEFAULT_REGION: ${S3_REGION:?required}
  AWS_BUCKET: ${S3_BUCKET:?required}
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?required}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?required}
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
services:
  api:
    <<: *service-defaults
    image: ${OPENPAY_API_IMAGE:?required}
    environment: *openpay-env
    networks: [internal, shared]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
  horizon:
    <<: *service-defaults
    image: ${OPENPAY_HORIZON_IMAGE:?required}
    environment: *openpay-env
    networks: [internal, shared]
  scheduler:
    <<: *service-defaults
    image: ${OPENPAY_API_IMAGE:?required}
    command: ["php", "artisan", "schedule:work"]
    environment: *openpay-env
    networks: [internal, shared]
  web:
    <<: *service-defaults
    image: ${OPENPAY_WEB_IMAGE:?required}
    expose: ["3000"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${APP_URL:?required}/api
      API_URL: http://api
    networks: [internal]

networks:
  internal:
  shared:
    name: ${SHARED_NETWORK_NAME:?SHARED_NETWORK_NAME is required}
    external: true
