name: openpay
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-openpay-env: &openpay-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?required}
  APP_KEY: ${APP_KEY:?required}
  DB_CONNECTION: mysql
  DB_HOST: ${DB_HOST:?required}
  DB_PORT: ${DB_PORT:?required}
  DB_DATABASE: ${DB_DATABASE:?required}
  DB_USERNAME: ${DB_USERNAME:?required}
  DB_PASSWORD: ${DB_PASSWORD:?required}
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  MAIL_MAILER: smtp
  MAIL_HOST: ${SMTP_HOST:?required}
  MAIL_PORT: ${SMTP_PORT:?required}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?required}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:?required}
  FILESYSTEM_DISK: s3
  AWS_ENDPOINT: ${S3_ENDPOINT:?required}
  AWS_DEFAULT_REGION: ${S3_REGION:?required}
  AWS_BUCKET: ${S3_BUCKET:?required}
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?required}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?required}
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

x-openpay-build: &openpay-build
  context: https://github.com/CiprianSpiridon/OpenPayApi.git#main
  secrets:
    - source: git_auth_token
      target: GIT_AUTH_TOKEN
  dockerfile_inline: |
    FROM php:8.4-fpm-alpine
    WORKDIR /var/www/html
    RUN apk add --no-cache \
        git curl zip unzip icu-dev libzip-dev libpng-dev libjpeg-turbo-dev \
        freetype-dev oniguruma-dev libxml2-dev linux-headers tini $${PHPIZE_DEPS} \
        && docker-php-ext-configure gd --with-freetype --with-jpeg \
        && docker-php-ext-install pdo_mysql bcmath gd exif pcntl sockets intl zip mbstring xml
    RUN pecl install redis mongodb && docker-php-ext-enable redis mongodb
    COPY --from=composer:2 /usr/bin/composer /usr/bin/composer
    COPY . .
    # Two upstream filenames sort before the migrations that provide their tables/columns.
    # Rename them in the deployment image so greenfield migrations run in dependency order.
    RUN mv database/migrations/2025_01_15_000001_add_enhanced_compensation_fields.php \
        database/migrations/2025_06_17_092807_add_enhanced_compensation_fields.php && \
        mv database/migrations/2025_06_28_000000_add_status_to_salary_submissions_table.php \
        database/migrations/2025_06_27_100534_add_status_to_salary_submissions_table.php
    RUN cp -n .env.example .env 2>/dev/null || true; \
        composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist; \
        rm -f .env
    RUN chown -R www-data:www-data storage bootstrap/cache && chmod -R 775 storage bootstrap/cache
    USER www-data
    EXPOSE 9000
    ENTRYPOINT ["/sbin/tini", "--"]
    CMD ["php-fpm"]

services:
  migrate:
    <<: *service-defaults
    build: *openpay-build
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]
    environment: *openpay-env
    networks: [internal, shared]
  app:
    <<: *service-defaults
    build: *openpay-build
    environment: *openpay-env
    networks: [internal, shared]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
  nginx:
    <<: *service-defaults
    build:
      context: https://github.com/CiprianSpiridon/OpenPayApi.git#main
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
      dockerfile_inline: |
        FROM nginx:1.27-alpine
        RUN <<'EOF'
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        server {
            listen 80;
            server_name _;
            root /var/www/html/public;
            index index.php;
            location / { try_files $$uri $$uri/ /index.php?$$query_string; }
            location ~ \.php$ {
                include fastcgi_params;
                fastcgi_pass app:9000;
                fastcgi_param SCRIPT_FILENAME $$document_root$$fastcgi_script_name;
                fastcgi_param HTTP_PROXY "";
            }
            location ~ /\.(?!well-known).* { deny all; }
        }
        NGINX
        EOF
        COPY public /var/www/html/public
        EXPOSE 80
    expose: ["80"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      app:
        condition: service_healthy
  worker:
    <<: *service-defaults
    build: *openpay-build
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    environment: *openpay-env
    networks: [internal, shared]
    depends_on:
      migrate:
        condition: service_completed_successfully
  scheduler:
    <<: *service-defaults
    build: *openpay-build
    command: ["php", "artisan", "schedule:work"]
    environment: *openpay-env
    networks: [internal, shared]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    <<: *service-defaults
    build:
      context: https://github.com/CiprianSpiridon/OpenPayWeb.git#main
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:?required}/api/v1
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY . .
        ARG NEXT_PUBLIC_API_URL
        ENV NEXT_PUBLIC_API_URL=$${NEXT_PUBLIC_API_URL}
        RUN npm run build
        ENV NODE_ENV=production HOSTNAME=0.0.0.0 PORT=3000
        EXPOSE 3000
        CMD ["npm", "run", "start"]
    expose: ["3000"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:?required}/api/v1
      API_URL: http://nginx
    networks: [internal]

networks:
  internal:
  shared:
    name: ${SHARED_NETWORK_NAME:?SHARED_NETWORK_NAME is required}
    external: true

secrets:
  git_auth_token:
    environment: GIT_AUTH_TOKEN
