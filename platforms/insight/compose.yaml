name: insight
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  redirect:
    <<: *service-defaults
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${COOLIFY_RESOURCE_UUID:-}
      traefik.http.middlewares.clavinci-force-https.redirectscheme.scheme: https
      traefik.http.middlewares.clavinci-force-https.redirectscheme.permanent: "true"
      traefik.http.routers.clavinci-apex-http.entrypoints: http
      traefik.http.routers.clavinci-apex-http.priority: "10000"
      traefik.http.routers.clavinci-apex-http.rule: Host(`clavinci.com`)
      traefik.http.routers.clavinci-apex-http.service: clavinci-http-redirect
      traefik.http.routers.clavinci-apex-https.entrypoints: https
      traefik.http.routers.clavinci-apex-https.priority: "10000"
      traefik.http.routers.clavinci-apex-https.rule: Host(`clavinci.com`)
      traefik.http.routers.clavinci-apex-https.service: clavinci-http-redirect
      traefik.http.routers.clavinci-apex-https.tls: "true"
      traefik.http.routers.clavinci-apex-https.tls.certresolver: letsencrypt
      traefik.http.routers.clavinci-www-http.entrypoints: http
      traefik.http.routers.clavinci-www-http.priority: "10000"
      traefik.http.routers.clavinci-www-http.rule: Host(`www.clavinci.com`)
      traefik.http.routers.clavinci-www-http.middlewares: clavinci-force-https
      traefik.http.routers.clavinci-www-http.service: clavinci-http-redirect
      traefik.http.routers.clavinci-api-http.entrypoints: http
      traefik.http.routers.clavinci-api-http.priority: "10000"
      traefik.http.routers.clavinci-api-http.rule: Host(`api.clavinci.com`)
      traefik.http.routers.clavinci-api-http.middlewares: clavinci-force-https
      traefik.http.routers.clavinci-api-http.service: clavinci-http-redirect
      traefik.http.services.clavinci-http-redirect.loadbalancer.server.port: "8080"
    expose: ["8080"]
    configs:
      - source: apex_redirect
        target: /etc/nginx/conf.d/default.conf
    networks: [default, internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q '^ok$'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_signal: SIGQUIT
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 32M

  api:
    <<: *service-defaults
    labels:
      traefik.docker.network: ${COOLIFY_RESOURCE_UUID:-}
    build:
      context: https://github.com/ulpi-io/insight.git#3005a926e54b7b3cc784310858fc649513e968b2
      dockerfile: apps/api/Dockerfile
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
    expose: ["8080"]
    environment:
      NODE_ENV: production
      ULPI_DB_URL: mysql://${DB_USERNAME:?required}:${DB_PASSWORD:?required}@${DB_HOST:?required}:${DB_PORT:?required}/${DB_DATABASE:?required}
      ULPI_BIND_HOST: 0.0.0.0
      ULPI_BIND_PORT: "8080"
      ULPI_AUTH_SIGNING_KEY: ${ULPI_AUTH_SIGNING_KEY:?required}
      ULPI_BOOTSTRAP_ADMIN_TOKEN: ${ULPI_BOOTSTRAP_ADMIN_TOKEN:?required}
      ULPI_OAUTH_GOOGLE_CLIENT_ID: ${ULPI_OAUTH_GOOGLE_CLIENT_ID:?required}
      ULPI_OAUTH_GOOGLE_CLIENT_SECRET: ${ULPI_OAUTH_GOOGLE_CLIENT_SECRET:?required}
      ULPI_OAUTH_REDIRECT_BASE: ${ULPI_OAUTH_REDIRECT_BASE:?required}
      ULPI_OAUTH_DASHBOARD_ORIGIN: ${APP_URL:?required}
    networks: [internal, shared]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  marketing:
    <<: *service-defaults
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${COOLIFY_RESOURCE_UUID:-}
      traefik.http.middlewares.clavinci-marketing-force-https.redirectscheme.scheme: https
      traefik.http.middlewares.clavinci-marketing-force-https.redirectscheme.permanent: "true"
      traefik.http.routers.clavinci-marketing-http.entrypoints: http
      traefik.http.routers.clavinci-marketing-http.priority: "11000"
      traefik.http.routers.clavinci-marketing-http.rule: Host(`www.clavinci.com`)
      traefik.http.routers.clavinci-marketing-http.middlewares: clavinci-marketing-force-https
      traefik.http.routers.clavinci-marketing-http.service: clavinci-marketing
      traefik.http.routers.clavinci-marketing-https.entrypoints: https
      traefik.http.routers.clavinci-marketing-https.priority: "11000"
      traefik.http.routers.clavinci-marketing-https.rule: Host(`www.clavinci.com`)
      traefik.http.routers.clavinci-marketing-https.service: clavinci-marketing
      traefik.http.routers.clavinci-marketing-https.tls: "true"
      traefik.http.routers.clavinci-marketing-https.tls.certresolver: letsencrypt
      traefik.http.services.clavinci-marketing.loadbalancer.server.port: "3000"
    build:
      context: https://github.com/ulpi-io/insight.git#3005a926e54b7b3cc784310858fc649513e968b2
      dockerfile: apps/marketing/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?required}
        NEXT_PUBLIC_LEGAL_NAME: ${NEXT_PUBLIC_LEGAL_NAME:?required}
        NEXT_PUBLIC_LEGAL_CONTACT: ${NEXT_PUBLIC_LEGAL_CONTACT:?required}
        NEXT_PUBLIC_PRIVACY_CONTACT: ${NEXT_PUBLIC_PRIVACY_CONTACT:?required}
        NEXT_PUBLIC_SECURITY_CONTACT: ${NEXT_PUBLIC_SECURITY_CONTACT:?required}
        NEXT_PUBLIC_GOVERNING_LAW: ${NEXT_PUBLIC_GOVERNING_LAW:?required}
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
    expose: ["3000"]
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?required}
      NEXT_PUBLIC_LEGAL_NAME: ${NEXT_PUBLIC_LEGAL_NAME:?required}
      NEXT_PUBLIC_LEGAL_CONTACT: ${NEXT_PUBLIC_LEGAL_CONTACT:?required}
      NEXT_PUBLIC_PRIVACY_CONTACT: ${NEXT_PUBLIC_PRIVACY_CONTACT:?required}
      NEXT_PUBLIC_SECURITY_CONTACT: ${NEXT_PUBLIC_SECURITY_CONTACT:?required}
      NEXT_PUBLIC_GOVERNING_LAW: ${NEXT_PUBLIC_GOVERNING_LAW:?required}
    networks: [default]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  dashboard:
    <<: *service-defaults
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${COOLIFY_RESOURCE_UUID:-}
      traefik.http.middlewares.clavinci-dashboard-force-https.redirectscheme.scheme: https
      traefik.http.middlewares.clavinci-dashboard-force-https.redirectscheme.permanent: "true"
      traefik.http.routers.clavinci-dashboard-http.entrypoints: http
      traefik.http.routers.clavinci-dashboard-http.priority: "11000"
      traefik.http.routers.clavinci-dashboard-http.rule: Host(`app.clavinci.com`)
      traefik.http.routers.clavinci-dashboard-http.middlewares: clavinci-dashboard-force-https
      traefik.http.routers.clavinci-dashboard-http.service: clavinci-dashboard
      traefik.http.routers.clavinci-dashboard-https.entrypoints: https
      traefik.http.routers.clavinci-dashboard-https.priority: "11000"
      traefik.http.routers.clavinci-dashboard-https.rule: Host(`app.clavinci.com`)
      traefik.http.routers.clavinci-dashboard-https.service: clavinci-dashboard
      traefik.http.routers.clavinci-dashboard-https.tls: "true"
      traefik.http.routers.clavinci-dashboard-https.tls.certresolver: letsencrypt
      traefik.http.services.clavinci-dashboard.loadbalancer.server.port: "8080"
    build:
      context: https://github.com/ulpi-io/insight.git#3005a926e54b7b3cc784310858fc649513e968b2
      dockerfile: apps/dashboard/Dockerfile
      secrets:
        - source: git_auth_token
          target: GIT_AUTH_TOKEN
    expose: ["8080"]
    environment:
      ULPI_API_URL: http://api:8080
    networks: [default, internal]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  default:
    name: ${COOLIFY_RESOURCE_UUID:-insight}
    external: true
  internal:
  shared:
    name: ${SHARED_NETWORK_NAME:?SHARED_NETWORK_NAME is required}
    external: true

configs:
  apex_redirect:
    content: |
      server {
          listen 8080;
          server_name _;

          location = /healthz {
              access_log off;
              default_type text/plain;
              return 200 "ok\n";
          }

          location / {
              return 301 https://www.clavinci.com$$request_uri;
          }
      }

secrets:
  git_auth_token:
    environment: GIT_AUTH_TOKEN
