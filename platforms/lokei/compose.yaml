name: lokei
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-laravel-env: &laravel-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?APP_URL is required}
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  DB_CONNECTION: mysql
  DB_HOST: ${DB_HOST:?DB_HOST is required}
  DB_PORT: ${DB_PORT:?DB_PORT is required}
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  REDIS_CLIENT: phpredis
  REDIS_HOST: ${QUEUE_HOST:?QUEUE_HOST is required}
  REDIS_PORT: ${QUEUE_PORT:?QUEUE_PORT is required}
  REDIS_USERNAME: ${QUEUE_USERNAME:?QUEUE_USERNAME is required}
  REDIS_PASSWORD: ${QUEUE_PASSWORD:?QUEUE_PASSWORD is required}
  REDIS_PREFIX: ${QUEUE_PREFIX:?QUEUE_PREFIX is required}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  MAIL_MAILER: smtp
  MAIL_HOST: ${SMTP_HOST:?SMTP_HOST is required}
  MAIL_PORT: ${SMTP_PORT:?SMTP_PORT is required}
  MAIL_ENCRYPTION: "null"
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS is required}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:?MAIL_FROM_NAME is required}
  LOG_CHANNEL: stderr

services:
  api:
    <<: *service-defaults
    image: ${LOKEI_API_IMAGE:?required}
    environment: *laravel-env
    networks: [internal, shared]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/up >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
  worker:
    <<: *service-defaults
    image: ${LOKEI_API_IMAGE:?required}
    command: ["php", "artisan", "horizon"]
    environment: *laravel-env
    networks: [internal, shared]
  scheduler:
    <<: *service-defaults
    image: ${LOKEI_API_IMAGE:?required}
    command: ["php", "artisan", "schedule:work"]
    environment: *laravel-env
    networks: [internal, shared]
  relay:
    <<: *service-defaults
    image: ${LOKEI_RELAY_IMAGE:?required}
    environment:
      NODE_ENV: production
      API_URL: http://api:8000
    networks: [internal]
  web:
    <<: *service-defaults
    image: ${LOKEI_WEB_IMAGE:?required}
    expose: ["3000"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${APP_URL:?required}/api
      API_URL: http://api:8000
    networks: [internal]

networks:
  internal:
  shared:
    name: ${SHARED_NETWORK_NAME:?SHARED_NETWORK_NAME is required}
    external: true
